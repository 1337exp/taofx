<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>taofx: один эффект в четырёх бэкендах</title>
    <style>
        html, body { margin: 0; background: #0b0d12; color: #d6d9e0; font: 13px/1.45 system-ui, sans-serif; }
        main { max-width: 1180px; margin: 0 auto; padding: 16px; }
        h1 { font-size: 16px; margin: 0 0 4px; }
        .row { display: flex; flex-wrap: wrap; gap: 12px; margin: 12px 0; }
        figure { margin: 0; }
        h2 { font-size: 13px; margin: 16px 0 0; color: #b7bdc9; }
        figcaption { margin-top: 4px; color: #8b929c; font-size: 12px; max-width: 256px; }
        canvas.out { display: block; width: 256px; height: 256px; border: 1px solid #222733; background: #000; image-rendering: pixelated; }
        pre { margin: 0; padding: 10px 12px; border-radius: 6px; background: #10131a; color: #c8d0e0; white-space: pre-wrap; }
        .ok { color: #7fd69a; }
        .bad { color: #ff8f8f; }
        label { display: inline-flex; gap: 8px; align-items: center; }
    </style>
</head>
<body>
    <main>
        <h1>Один файл эффекта (<code>effect.json</code>) в четырёх бэкендах</h1>
        <div>
            <label>Время эффекта, с <input id="time" type="range" min="0" max="10" step="0.05" value="1.5" /> <span id="timeValue">1.5</span></label>
        </div>
        <div style="margin-top: 8px"><button id="bench">Замер скорости</button> <span id="benchNote" style="color:#8b929c"></span></div>
        <div id="images"></div>
        <pre id="report">…</pre>
    </main>
    <script type="module" src="./main.ts"></script>
</body>
</html>
